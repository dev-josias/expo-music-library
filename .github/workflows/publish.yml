name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Validate release source
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified tarball
    needs: ci
    runs-on: ubuntu-24.04
    environment: npm
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install dependencies from the committed lock
        run: bun install --frozen-lockfile

      - name: Verify tag and package version
        run: bun run verify:release "${GITHUB_REF_NAME}"

      - name: Build package source for artifact comparison
        run: bun run build

      - name: Restore the exact artifact validated by CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ github.sha }}
          path: npm-artifact

      - name: Reverify the downloaded artifact
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          ARTIFACT="npm-artifact/expo-music-library-${VERSION}.tgz"
          test -f "$ARTIFACT"
          node scripts/verify-package.cjs "$ARTIFACT"

      - name: Publish or reconcile the verified artifact
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          node scripts/publish-package.cjs "npm-artifact/expo-music-library-${VERSION}.tgz"
